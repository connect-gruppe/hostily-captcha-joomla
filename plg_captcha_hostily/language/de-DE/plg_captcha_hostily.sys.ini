PLG_CAPTCHA_HOSTILY_XML_DESCRIPTION="Spamschutz von hostily (captcha.hostily.de). Legen Sie auf captcha.hostily.de ein Projekt an, tragen Sie Site-Key und Secret hier ein und wählen Sie dann „hostily Captcha“ unter System > Konfiguration > Standard-Captcha (und in den Optionen der Komponenten, die ein Captcha anbieten)."
