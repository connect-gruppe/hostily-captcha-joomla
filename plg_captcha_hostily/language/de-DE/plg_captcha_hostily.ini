; hostily-Captcha-Plugin (Deutsch)
PLG_CAPTCHA_HOSTILY="hostily Captcha"
PLG_CAPTCHA_HOSTILY_XML_DESCRIPTION="Spamschutz von hostily (captcha.hostily.de). Legen Sie auf captcha.hostily.de ein Projekt an, tragen Sie Site-Key und Secret hier ein und wählen Sie dann „hostily Captcha“ unter System > Konfiguration > Standard-Captcha (und in den Optionen der Komponenten, die ein Captcha anbieten)."
PLG_CAPTCHA_HOSTILY_SITE_KEY_LABEL="Site-Key"
PLG_CAPTCHA_HOSTILY_SITE_KEY_DESC="Öffentlicher Schlüssel Ihres Projekts auf captcha.hostily.de. Tragen Sie dort die Domain dieser Seite unter „erlaubte Domains“ ein."
PLG_CAPTCHA_HOSTILY_SECRET_LABEL="Secret"
PLG_CAPTCHA_HOSTILY_SECRET_DESC="Geheimer Schlüssel des Projekts (wird nur vom Server benutzt). Ohne Site-Key und Secret ist nichts geschützt und nichts gesperrt."
PLG_CAPTCHA_HOSTILY_SERVICE_URL_LABEL="Dienst-URL"
PLG_CAPTCHA_HOSTILY_SERVICE_URL_DESC="Vorgabe: https://captcha.hostily.de (eigene Installation möglich)."
PLG_CAPTCHA_HOSTILY_MODE_LABEL="Modus"
PLG_CAPTCHA_HOSTILY_MODE_DESC="Sichtbar zeigt ein Kästchen; unsichtbar löst die Prüfung beim Absenden des Formulars. „Gedrückt halten“ und „Schieberegler“ bieten immer zusätzlich die Alternative „Per Klick bestätigen“. „Wie im Kundenportal“ übernimmt die Einstellung Ihres Projekts auf captcha.hostily.de."
PLG_CAPTCHA_HOSTILY_MODE_VISIBLE="Sichtbar (Kästchen)"
PLG_CAPTCHA_HOSTILY_MODE_INVISIBLE="Unsichtbar (löst beim Absenden)"
PLG_CAPTCHA_HOSTILY_MODE_PORTAL="Wie im Kundenportal"
PLG_CAPTCHA_HOSTILY_MODE_HOLD="Gedrückt halten"
PLG_CAPTCHA_HOSTILY_MODE_SLIDE="Schieberegler"
PLG_CAPTCHA_HOSTILY_HOLD_TIME_LABEL="Haltezeit (ms)"
PLG_CAPTCHA_HOSTILY_HOLD_TIME_DESC="800 bis 3000 Millisekunden, nur für „Gedrückt halten“."
PLG_CAPTCHA_HOSTILY_LANGUAGE_LABEL="Sprache des Widgets"
PLG_CAPTCHA_HOSTILY_LANGUAGE_DESC="„Automatisch“ nimmt die Sprache der Seite (Deutsch oder Englisch, sonst entscheidet das Widget)."
PLG_CAPTCHA_HOSTILY_LANGUAGE_AUTO="Automatisch"
PLG_CAPTCHA_HOSTILY_LANGUAGE_DE="Deutsch"
PLG_CAPTCHA_HOSTILY_LANGUAGE_EN="Englisch"
PLG_CAPTCHA_HOSTILY_ON_ERROR_LABEL="Bei Ausfall des Dienstes"
PLG_CAPTCHA_HOSTILY_ON_ERROR_DESC="Gilt auch bei falschem Secret. Steht immer in administrator/logs/plg_captcha_hostily.log.php."
PLG_CAPTCHA_HOSTILY_ON_ERROR_PASS="Besucher durchlassen (Standard)"
PLG_CAPTCHA_HOSTILY_ON_ERROR_BLOCK="Blockieren"
PLG_CAPTCHA_HOSTILY_ERROR_REJECTED="Ihre Eingabe wurde vom Spamschutz abgelehnt. Bitte versuchen Sie es erneut."
PLG_CAPTCHA_HOSTILY_ERROR_EXPIRED="Bitte bestätigen Sie, dass Sie kein Roboter sind (die Prüfung fehlt oder ist abgelaufen), und senden Sie das Formular erneut."
PLG_CAPTCHA_HOSTILY_ERROR_UNAVAILABLE="Der Spamschutz ist derzeit nicht erreichbar. Bitte versuchen Sie es später erneut."
